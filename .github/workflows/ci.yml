name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend dependencies and quality tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov ruff mypy bandit pip-audit

      - name: Lint (critical rules)
        run: |
          ruff check --select E9,F63,F7,F82,B api risk_management run_short_term.py tests

      - name: Type check (baseline)
        run: |
          mypy

      - name: Security scan (Bandit)
        run: |
          bandit -q -r api risk_management run_short_term.py

      - name: Dependency vulnerability scan
        run: |
          pip-audit -r requirements.txt

      - name: Unit and contract tests with coverage gate
        run: |
          pytest tests -q --cov=api --cov=risk_management --cov-report=xml --cov-report=term-missing --cov-fail-under=30

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  frontend-quality:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dashboard-web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard-web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
